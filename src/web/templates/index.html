<!DOCTYPE html>
<html lang="en">
<script>
    // Game control functions
    function startNewGame() {
        game.startNewGame();
    }

    function saveGame() {
        game.saveGame();
    }

    function loadGame(event) {
        const file = event.target.files[0];
        if (file) {
            game.loadGame(file);
        }
    }

    function quitGame() {
        game.quitGame();
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Command Line Adventure</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4 h-screen flex flex-col">
        <!-- Header with game controls -->
        <header class="bg-gray-800 text-white p-4 rounded-t-lg flex justify-between items-center">
            <h1 class="text-2xl font-bold">D&D Adventure</h1>
            <div class="space-x-4">
                <button onclick="startNewGame()" class="btn-primary">New Game</button>
                <button onclick="saveGame()" class="btn-secondary">Save</button>
                <input type="file" id="loadGameFile" class="hidden" accept=".json" onchange="loadGame(event)">
                <button onclick="document.getElementById('loadGameFile').click()" class="btn-secondary">Load</button>
                <button onclick="quitGame()" class="btn-danger">Quit</button>
            </div>
        </header>

        <!-- Main game area -->
        <div class="flex-1 flex gap-4 mt-4">
            <!-- Location sidebar -->
            <div class="w-64 bg-white rounded-lg shadow-lg p-4">
                <h2 class="text-xl font-bold mb-4">Current Location</h2>
                <div id="current-location" class="mb-4 p-2 bg-blue-100 rounded">
                    <!-- Current location will be inserted here -->
                </div>
                <h3 class="font-bold mb-2">Location History</h3>
                <div id="location-history" class="space-y-2">
                    <!-- Location history will be inserted here -->
                </div>
            </div>

            <!-- Chat area -->
            <div class="flex-1 bg-white rounded-lg shadow-lg flex flex-col">
                <!-- Chat messages -->
                <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-4">
                    <!-- Messages will be inserted here -->
                </div>

                <!-- Quest options -->
                <div id="quest-options" class="p-4 border-t border-gray-200">
                    <!-- Quest options will be inserted here -->
                </div>

                <!-- Input area -->
                <div class="p-4 border-t border-gray-200">
                    <div class="flex space-x-4">
                        <input type="text" id="chat-input"
                               class="flex-1 p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
                               placeholder="Type your action...">
                        <button onclick="sendMessage()" class="btn-primary">Send</button>
                    </div>
                </div>
            </div>

            <!-- Quest sidebar -->
            <div class="w-80 bg-white rounded-lg shadow-lg p-4">
                <h2 class="text-xl font-bold mb-4">Active Quests</h2>
                <div id="quest-list" class="space-y-4">
                    <!-- Quests will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/ui.js"></script>
    <script src="/static/js/chat.js"></script>
    <script src="/static/js/game.js"></script>
</body>
</html>
